name: Downloads badge

# shields.io counts only the newest 100 releases; this sums every release and serves the badge JSON from Pages.
on:
  schedule:
    - cron: "17 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.count.outputs.changed }}
    steps:
      - name: Count downloads
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')
          mkdir -p site
          python3 - "$total" > site/downloads.json <<'EOF'
          import json, sys
          n = int(sys.argv[1])
          def short(v):
              for limit, suffix in ((10**9, 'G'), (10**6, 'M'), (10**3, 'k')):
                  if v >= limit:
                      x = v / limit
                      text = f'{x:.1f}'.removesuffix('.0') if x < 10 else f'{round(x)}'
                      return text + suffix
              return str(v)
          assert short(4564) == '4.6k' and short(31568) == '32k' and short(999) == '999' and short(10000) == '10k'
          print(json.dumps({"schemaVersion": 1, "label": "downloads-total", "message": short(n), "color": "brightgreen"}))
          EOF
          cat site/downloads.json
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/downloads.json"
          if curl --fail --silent --show-error --retry 2 --max-time 15 "$url" -o published.json &&
            cmp -s site/downloads.json published.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.count.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: badge
    if: needs.badge.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5.0.1
