name: Downloads badge

# Sum every release and keep the badge JSON in a data branch.
on:
  schedule:
    - cron: "17 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: download-counts
      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')
          python3 - "$total" > downloads.json <<'EOF'
          import json, sys
          n = int(sys.argv[1])
          def short(v):
              for limit, suffix in ((10**9, 'G'), (10**6, 'M'), (10**3, 'k')):
                  if v >= limit:
                      x = v / limit
                      text = f'{x:.1f}'.removesuffix('.0') if x < 10 else f'{round(x)}'
                      return text + suffix
              return str(v)
          assert short(4564) == '4.6k' and short(31568) == '32k' and short(999) == '999' and short(10000) == '10k'
          print(json.dumps({"schemaVersion": 1, "label": "downloads-total", "message": short(n), "color": "brightgreen"}))
          EOF
          if git diff --quiet -- downloads.json; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update download count' -- downloads.json
          git push origin HEAD:refs/heads/download-counts
